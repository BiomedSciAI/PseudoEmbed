[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudoembed"
version = "0.1.0"
description = "Pseudotime analysis with embedding integration for single-cell transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    { name = "Matthew Madgwick", email = "mattmadgwick@ibm.com" },
    { name = "Ching-Huei Tsou", email = "ctsou@us.ibm.com" },
]
keywords = ["single-cell", "pseudotime", "embeddings", "transcriptomics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# decoupler is required, not optional: the TF and pathway views are built from
# its ULM scores, so neither the multiview nor the attribution pipeline runs
# without it.  torch/torchvision were dropped along with workflows/probing.py.
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scanpy>=1.10.0",
    "anndata>=0.8.0",
    "typer>=0.9.0",
    "decoupler>=2.0.0",
    "scanpy[leiden]",
    # Ensembl -> gene-symbol mapping for pseudoembed.data.richard2018; the
    # priors (CollecTRI, PROGENy) are keyed on symbols, not Ensembl IDs.
    "pybiomart>=0.2.0",
]

[project.optional-dependencies]
full = [
    "decoupler[full]>=2.0.0",
    "dcor>=0.5.0",
    "igraph>=0.10.0",
    "gprofiler-official>=1.0.0",
]
hypergraph = [
    "xgi>=0.7.0",
]
# Optimal-transport delay/divergence decomposition
# (pseudoembed.analysis.ot_delay_divergence).
ot = [
    "pot>=0.9.0",
]
# Benchmark suite (experiments/benchmark): competitor methods and reporting.
benchmark = [
    "palantir>=1.3.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.0.250",
    "mypy>=0.990",
]
notebook = [
    "jupyterlab>=3.0.0",
    "ipywidgets>=7.6.0",
    # Needed to BUILD and EXECUTE the tutorials, not merely to view them:
    # examples/_generators/*.py author the .ipynb with nbformat, and the
    # documented execute step is `jupyter nbconvert --execute`.
    "nbformat>=5.7.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
pseudoembed = "pseudoembed.cli.main:main"

[project.urls]
Homepage = "https://github.com/BiomedSciAI/PseudoEmbed"
Documentation = "https://github.com/BiomedSciAI/PseudoEmbed#readme"
Repository = "https://github.com/BiomedSciAI/PseudoEmbed"
"Bug Tracker" = "https://github.com/BiomedSciAI/PseudoEmbed/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pseudoembed*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
pseudoembed = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scanpy.*",
    "anndata.*",
    "decoupler.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is deliberately NOT in the default addopts: it roughly doubles the
# run time and writes htmlcov/.  For a coverage run, ask for it explicitly:
#   pytest --cov=pseudoembed --cov-report=term-missing --cov-report=html
addopts = [
    "--verbose",
]
markers = [
    # Tests that hit the network (decoupler prior downloads) or run heavy
    # numerical work. Deselect with: pytest -m "not slow"
    "slow: requires network access or is computationally expensive",
]
